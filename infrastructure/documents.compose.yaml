name: storebench-documents
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: storebench
      POSTGRES_USER: storebench
      POSTGRES_PASSWORD: storebench_local
    ports:
      - "127.0.0.1:5433:5432"
    cpus: 2
    mem_limit: 4g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storebench -d storebench"]
      interval: 5s
      timeout: 3s
      retries: 20

  couchdb:
    image: couchdb:3.5.1
    environment:
      COUCHDB_USER: storebench
      COUCHDB_PASSWORD: storebench_local
    ports:
      - "127.0.0.1:5985:5984"
    cpus: 2
    mem_limit: 4g
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u storebench:storebench_local http://127.0.0.1:5984/_up >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  couchdb_data:

name: storebench-documents
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: storebench
      POSTGRES_USER: storebench
      POSTGRES_PASSWORD: storebench_local
    ports:
      - "127.0.0.1:5433:5432"
    cpus: 2
    mem_limit: 4g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storebench -d storebench"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8.0.15
    environment:
      MONGO_INITDB_ROOT_USERNAME: storebench
      MONGO_INITDB_ROOT_PASSWORD: storebench_local
    ports:
      - "127.0.0.1:27018:27017"
    cpus: 2
    mem_limit: 4g
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username storebench --password storebench_local --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mongo_data:

name: storebench-search
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: storebench
      POSTGRES_USER: storebench
      POSTGRES_PASSWORD: storebench_local
    ports:
      - "127.0.0.1:5435:5432"
    cpus: 2
    mem_limit: 4g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storebench -d storebench"]
      interval: 5s
      timeout: 3s
      retries: 20
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9201:9200"
    cpus: 2
    mem_limit: 4g
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    profiles: [ui]
    environment:
      PGADMIN_DEFAULT_EMAIL: storebench@example.com
      PGADMIN_DEFAULT_PASSWORD: storebench_local
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:5055:80"
    cpus: 1
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    profiles: [ui]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5602:5601"
    cpus: 1
    mem_limit: 2g
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  postgres_data:
  opensearch_data:
